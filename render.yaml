services:
  - type: web
    name: healthconnect-clinic
    env: node
    buildCommand: npm install && npm run build:prod
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/health
    scaling:
      minInstances: 1
      maxInstances: 3
