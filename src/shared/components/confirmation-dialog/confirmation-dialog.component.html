@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" @fadeInOut>
    <!-- Background overlay -->
    <div 
      class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" 
      (click)="cancel()"
      @fadeInOut>
    </div>
    
    <!-- Modal -->
    <div 
      class="relative bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-md w-full mx-auto"
      @slideInOut>
      <div class="p-6">
        <div class="flex items-start space-x-4">
          <div class="flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-red-100 dark:bg-red-900/20">
            <i class="ri-alert-line text-red-600 dark:text-red-400 text-xl"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">
              {{ config().title }}
            </h3>
            <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">
              {{ config().message }}
            </p>
          </div>
        </div>
      </div>
      
      <!-- Action buttons -->
      <div class="flex items-center justify-end space-x-3 px-6 py-4 bg-gray-50 dark:bg-gray-700/50 rounded-b-xl">
        <button 
          (click)="cancel()"
          type="button"
          class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors duration-200">
          {{ config().cancelText }}
        </button>
        <button 
          (click)="confirm()"
          type="button"
          [class]="'px-4 py-2 text-sm font-medium text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors duration-200 ' + config().confirmButtonClass">
          {{ config().confirmText }}
        </button>
      </div>
    </div>
  </div>
}
